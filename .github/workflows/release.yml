name: Auto Build, Tag & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Multi-Platform Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install pyobjc-framework-CoreWLAN
          pip install -r requirements.txt

      - name: Run Tests with pytest
        run: |
          python -m pytest tests/ -v

  autotag:
    name: Determine & Create Release Tag
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute_tag.outputs.tag }}
      version: ${{ steps.compute_tag.outputs.version }}
      commit_body: ${{ steps.commit_msg.outputs.body }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Recent Commit Message
        id: commit_msg
        run: |
          MSG=$(git log -1 --pretty=format:"%B")
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Compute Next Semantic Tag
        id: compute_tag
        run: |
          python -c "
          import re
          import subprocess
          import sys

          # 1. Read APP_VERSION from app.py
          with open('app.py', 'r', encoding='utf-8') as f:
              content = f.read()
          match = re.search(r'APP_VERSION\s*=\s*[\"\']([^\"\']+)[\"\']', content)
          if not match:
              raise SystemExit('Could not find APP_VERSION in app.py')
          app_ver = match.group(1).strip()

          # 2. Fetch existing git tags
          subprocess.run(['git', 'fetch', '--tags'], check=False)
          tag_output = subprocess.check_output(['git', 'tag', '-l']).decode('utf-8', errors='ignore')
          tags = [t.strip() for t in tag_output.splitlines() if t.strip()]

          target_tag = f'v{app_ver}'
          if target_tag in tags:
              parts = [int(p) for p in app_ver.split('.')]
              major, minor, patch = parts[0], parts[1], parts[2]
              pattern = re.compile(rf'^v{major}\.{minor}\.(\d+)$')
              patches = []
              for t in tags:
                  m = pattern.match(t)
                  if m:
                      patches.append(int(m.group(1)))
              next_patch = (max(patches) + 1) if patches else (patch + 1)
              target_tag = f'v{major}.{minor}.{next_patch}'
              final_ver = f'{major}.{minor}.{next_patch}'
          else:
              final_ver = app_ver

          print(f'Computed tag: {target_tag}')
          with open(sys.argv[1], 'a') as out:
              out.write(f'tag={target_tag}\n')
              out.write(f'version={final_ver}\n')
          " "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.compute_tag.outputs.tag }}"
          git push origin "${{ steps.compute_tag.outputs.tag }}"

  build-windows:
    name: Build Windows Installers
    needs: autotag
    runs-on: windows-latest

    steps:
      - name: Checkout Tagged Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.autotag.outputs.tag }}

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm Loqin.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Output
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc loqin_installer_script.iss
          & $iscc loqin_installer_winget.iss
          & $iscc loqin_updater_script.iss

      - name: Verify Installers Created
        shell: pwsh
        run: |
          $files = @(
            "Output\Install_Loqin.exe",
            "Output\Install_Loqin_WinGet.exe",
            "Output\Install_Loqin_Update.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) {
              throw "Expected installer file missing: $f"
            }
            Write-Host "Found installer: $f"
          }

      - name: Upload Windows Installers as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            Output/Install_Loqin.exe
            Output/Install_Loqin_WinGet.exe
            Output/Install_Loqin_Update.exe

  build-macos:
    name: Build macOS DMG
    needs: autotag
    runs-on: macos-latest

    steps:
      - name: Checkout Tagged Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.autotag.outputs.tag }}

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyobjc-framework-CoreWLAN
          pip install -r requirements.txt

      - name: Install create-dmg Packaging Tool
        run: brew install create-dmg

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --clean --noconfirm Loqin_mac.spec

      - name: Ad-Hoc Sign .app Bundle
        run: |
          codesign --force --deep -s - dist/Loqin.app

      - name: Generate DMG Installer
        run: |
          mkdir -p Output
          create-dmg \
            --volname "Loqin Installer" \
            --eula "eula.txt" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Loqin.app" 150 190 \
            --hide-extension "Loqin.app" \
            --app-drop-link 450 190 \
            "Output/Install_Loqin_macOS.dmg" \
            "dist/Loqin.app"

      - name: Ad-Hoc Sign DMG
        run: |
          codesign --force -s - "Output/Install_Loqin_macOS.dmg"

      - name: Upload macOS DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: Output/Install_Loqin_macOS.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [autotag, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Directory
        run: mkdir -p release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release_assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release_assets

      - name: List Release Assets
        run: ls -la release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.autotag.outputs.tag }}
          name: Loqin ${{ needs.autotag.outputs.tag }}
          body: ${{ needs.autotag.outputs.commit_body }}
          files: |
            release_assets/Install_Loqin.exe
            release_assets/Install_Loqin_WinGet.exe
            release_assets/Install_Loqin_Update.exe
            release_assets/Install_Loqin_macOS.dmg
